# ============================================================================
# 小凯记账 · 构建配置
# ============================================================================

# JVM 参数：Gradle + KSP + Compose 编译较吃内存，默认 512m 会 OOM。
# 2G 是 8/16G 内存机器的稳妥值；若机器内存 >= 32G 可改为 4096m 加快编译。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# 并行编译与构建缓存：多模块工程能明显缩短增量构建时间
org.gradle.parallel=true
org.gradle.caching=true

# Android 基础开关
android.useAndroidX=true
# 非传递 R 类：避免各模块 R 类互相污染，同时缩小 R 文件体积
android.nonTransitiveRClass=true

# Kotlin 代码风格采用官方规范（4 空格缩进、尾随逗号）
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
